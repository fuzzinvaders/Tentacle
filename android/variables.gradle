ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    // targetSdk 36 : exigé par Google Play (API 35 minimum, et 36 pour toute nouvelle app ou
    // mise à jour à partir du 31/08/2026). Rester en 34 rendrait l'app non publiable.
    //
    // Conséquence assumée : Android IMPOSE alors le mode edge-to-edge, et l'échappatoire
    // `windowOptOutEdgeToEdgeEnforcement` est DÉSACTIVÉE à partir de 36 (sur Android 16).
    // Le contenu est donc encarté « pour de vrai » : voir MainActivity.onCreate (padding
    // calculé depuis les WindowInsets) et windowBackground dans styles.xml, qui habille les
    // bandes situées sous les barres système.
    //
    // ⚠️ À VALIDER SUR APPAREIL (test 3.5.3 du plan de test). En cas de régression, repasser
    // à 34 rétablit l'ancien comportement — au prix de ne plus pouvoir publier sur Play.
    targetSdkVersion = 36
    // Version de l'app, lue par app/build.gradle. À incrémenter à chaque envoi sur Play :
    // Google refuse un versionCode déjà utilisé.
    appVersionCode = 1
    appVersionName = '1.0.0'
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}