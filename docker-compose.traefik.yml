# Exemple de deploiement de Tentacle derriere un reverse proxy Traefik
# (reseau Docker externe partage, decouverte automatique par labels).
#
# A adapter avant usage :
#   - ${DOMAIN}            : ton nom de domaine (ex. tentacle.exemple.fr)
#   - proxy (reseau)       : le nom du reseau Docker externe sur lequel Traefik ecoute
#   - entrypoints=websecure : adapte au nom de ton entrypoint HTTPS Traefik
#   - certresolver         : ajoute si tu utilises la resolution ACME de Traefik
#
# ATTENTION si Traefik gere deja d'autres domaines : un resolver ACME en DNS-01 est lie a
# UN SEUL fournisseur DNS (le token API configure sur ce resolver). S'il gere par exemple
# ton domaine principal chez Infomaniak et que ${DOMAIN} est enregistre chez un autre
# fournisseur (OVH, Cloudflare...), le meme resolver ne pourra JAMAIS emettre de certificat
# pour ce domaine : le provider ne sait pas poser le TXT `_acme-challenge` sur une zone
# qu'il ne gere pas. Le symptome est un certificat auto-signe Traefik ("TRAEFIK DEFAULT
# CERT") servi a la place, et dans les logs Traefik une erreur `unknown zone for
# '_acme-challenge.<domaine>'` ou `dns01: error presenting token`.
# Il faut alors un SECOND resolver dans la config statique Traefik, pointant vers le
# fournisseur qui gere reellement ce domaine, puis referencer son nom dans le label
# `certresolver` ci-dessous (pas forcement `letsencrypt`).
#
# Usage :
#   docker network create proxy   # si le reseau n'existe pas encore
#   DOMAIN=tentacle.exemple.fr docker compose -f docker-compose.traefik.yml up -d
#   # Mise a jour :
#   docker compose -f docker-compose.traefik.yml pull && \
#     docker compose -f docker-compose.traefik.yml up -d

services:
  tentacle:
    # Image PUBLIQUE par defaut : rien a builder, rien a configurer, aucun login.
    # Surcharge possible via TENTACLE_IMAGE (registre prive, image locale, tag fixe).
    image: ${TENTACLE_IMAGE:-ghcr.io/fuzzinvaders/tentacle:latest}
    container_name: tentacle
    restart: unless-stopped
    pull_policy: always
    environment:
      # Origine publique EXACTE de l'app (schema + domaine) : obligatoire pour
      # que la connexion (POST) ne soit pas rejetee comme CSRF.
      ORIGIN: https://${DOMAIN:?Definis DOMAIN=ton-domaine.tld}
      # Secret de signature des sessions (openssl rand -hex 32). Recommande.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Optionnel : jeton exige pour creer l'admin sur /setup (vide = ouvert).
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Optionnel : instance vitrine, propose le catalogue de demo (voir .env.example).
      DEMO_MODE: ${DEMO_MODE:-0}
    volumes:
      - tentacle-data:/data
    # Pas de "ports:" ici : Traefik route le trafic via le reseau partage,
    # pas besoin d'exposer le port sur l'hote.
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.tentacle.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.tentacle.entrypoints=websecure
      - traefik.http.routers.tentacle.tls=true
      # Nom du resolver ACME configure dans Traefik pour LE FOURNISSEUR DNS QUI GERE
      # CE DOMAINE precisement (voir l'avertissement en haut de fichier) — pas forcement
      # celui utilise pour tes autres domaines.
      # - traefik.http.routers.tentacle.tls.certresolver=letsencrypt
      - traefik.http.services.tentacle.loadbalancer.server.port=3000

volumes:
  tentacle-data:

networks:
  proxy:
    external: true
